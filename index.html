<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <script>
    // Tự phát hiện base path: GitHub Pages project site phục vụ ở /<repo>/, các host khác ở gốc "/".
    (function () {
      var base = location.hostname.endsWith('github.io') ? '/travel_vibe_coding/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelViet - Du Lịch Việt</title>
  <meta name="description" content="Đặt chuyến bay và tour du lịch trong nước, quốc tế cùng TravelViet." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    (function () {
      var redirect = sessionStorage.getItem('spa-redirect-path');
      if (redirect) {
        sessionStorage.removeItem('spa-redirect-path');
        if (redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, '', redirect);
        }
      }
    })();
  </script>
</head>
<body>
  <a href="#page-root" class="skip-link">Bỏ qua tới nội dung chính</a>

  <div id="loading-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:'Inter',sans-serif;color:#0B5ED7;background:#fff">
    <div style="width:48px;height:48px;border:4px solid #E2E8F0;border-top-color:#0B5ED7;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <div>Đang khởi tạo TravelViet...</div>
  </div>

  <div id="app" style="display:none">
    <div id="header-root"></div>
    <main id="page-root"></main>
    <div id="footer-root"></div>
  </div>
  <div id="toast-root" class="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
