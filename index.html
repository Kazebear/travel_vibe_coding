<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelViet - Du Lịch Việt</title>
  <meta name="description" content="Đặt chuyến bay và tour du lịch trong nước, quốc tế cùng TravelViet." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    /*
     * Chrome đọc trước (preload scanner) các thẻ <link>/<script src> ngay trong HTML gốc,
     * TRƯỚC KHI các <script> nội tuyến phía trên chạy — nên document.write('<base ...>') KHÔNG
     * đáng tin cậy để đổi đường dẫn các thẻ phía sau. Giải pháp: tự ghi thẳng các thẻ resource
     * với URL đã có sẵn prefix đúng (rỗng khi chạy ở gốc domain, "/travel_vibe_coding" khi ở
     * GitHub Pages project site), tránh phụ thuộc vào <base>.
     */
    (function () {
      var prefix = location.hostname.endsWith('github.io') ? '/travel_vibe_coding' : '';
      window.__APP_BASE__ = prefix + '/';
      ['css/reset.css', 'css/variables.css', 'css/global.css', 'css/components.css', 'css/pages.css', 'css/responsive.css'].forEach(function (href) {
        document.write('<link rel="stylesheet" href="' + prefix + '/' + href + '">');
      });
    })();
  </script>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    (function () {
      var redirect = sessionStorage.getItem('spa-redirect-path');
      if (redirect) {
        sessionStorage.removeItem('spa-redirect-path');
        if (redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, '', redirect);
        }
      }
    })();
  </script>
</head>
<body>
  <a href="#page-root" class="skip-link">Bỏ qua tới nội dung chính</a>

  <div id="loading-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:'Inter',sans-serif;color:#0B5ED7;background:#fff">
    <div style="width:48px;height:48px;border:4px solid #E2E8F0;border-top-color:#0B5ED7;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <div>Đang kết nối TravelViet...</div>
  </div>

  <div id="app" style="display:none">
    <div id="header-root"></div>
    <main id="page-root"></main>
    <div id="footer-root"></div>
  </div>
  <div id="toast-root" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    // Cloudflare Worker giu API key OpenWeatherMap cho du bao 5 ngay (xem worker/weather.js, project.md muc 11).
    window.WEATHER_API_BASE_URL = 'https://travelviet-weather.phongnguyen19990911.workers.dev';
  </script>
  <script>
    (function () {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = window.__APP_BASE__ + 'js/app.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
